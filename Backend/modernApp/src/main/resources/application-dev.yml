spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/medicheck
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop       # recreate schema on every restart in dev
    show-sql: true

logging:
  level:
    com.medicheck: DEBUG
    org.springframework.security: DEBUG